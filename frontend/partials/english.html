    <!-- ═══════════════════════════ ENGLISH LEARNING ═══════════════════════════ -->
    <section class="eng-page hidden" id="englishSection" aria-label="Học tiếng Anh">
        <div class="eng-inner">
            <div class="eng-header">
                <button type="button" class="bp-back-btn" onclick="closeEnglish()" aria-label="Quay lại">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
                        <path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="eng-header-center">
                    <h1 class="eng-title">🇺🇸 Học tiếng Anh mỗi ngày</h1>
                </div>
            </div>

            <!-- Stats -->
            <div class="eng-stats-grid" id="engStats"></div>
            <div class="eng-lb-btn-wrap"><button class="eng-lb-btn" onclick="engShowLeaderboard()">🏆 Bảng xếp hạng</button></div>

            <!-- Charts -->
            <div class="eng-charts" id="engCharts" style="display:none">
                <div class="eng-chart-row">
                    <div class="eng-chart-card">
                        <div class="eng-chart-title">📊 Mức độ thông thạo</div>
                        <div class="eng-donut-wrap" id="engMasteryDonut"></div>
                    </div>
                    <div class="eng-chart-card">
                        <div class="eng-chart-title">📚 Top chủ đề</div>
                        <div class="eng-bars-wrap" id="engTopicBars"></div>
                    </div>
                </div>
            </div>

            <!-- Study Timer -->
            <div class="eng-study-timer" id="engStudyTimer">
                <div class="eng-timer-left">
                    <span class="eng-timer-icon">⏱️</span>
                    <span class="eng-timer-time" id="engTimerDisplay">00:00</span>
                    <span class="eng-timer-label">hôm nay</span>
                </div>
                <div class="eng-timer-right">
                    <span class="eng-timer-goal" id="engTimerGoal">Mục tiêu: --</span>
                    <button class="eng-timer-set-btn" onclick="engSetStudyGoal()">⚙️</button>
                </div>
            </div>

            <!-- XP Bar -->
            <div class="eng-xp-container" id="engXPBar"></div>

            <!-- Daily Missions -->
            <div class="eng-missions" id="engMissions"></div>

            <!-- Tabs -->
            <div class="eng-tabs">
                <button class="eng-tab eng-tab-active" id="engTab_words" onclick="engShowTab('words')">✨ Tạo từ</button>
                <button class="eng-tab" id="engTab_saved" onclick="engShowTab('saved');engLoadSavedWords(1)">📖 Đã học</button>
                <button class="eng-tab" id="engTab_review" onclick="engStartReview()">🔄 Ôn tập</button>
                <button class="eng-tab" id="engTab_quiz" onclick="engStartQuiz()">🧠 Quiz</button>
                <button class="eng-tab" id="engTab_games" onclick="engShowTab('games')">🎮 Games</button>
            </div>

            <!-- Panel: Words -->
            <div id="engPanel_words">
                <!-- Generate bar -->
                <div class="eng-gen-bar">
                    <select class="eng-select" id="engTopic">
                        <option value="">-- Chọn chủ đề --</option>
                        <optgroup label="Kỳ thi">
                            <option value="IELTS Academic">IELTS Academic</option>
                            <option value="IELTS General">IELTS General</option>
                            <option value="TOEIC Listening & Reading">TOEIC L&R</option>
                            <option value="TOEIC Speaking & Writing">TOEIC S&W</option>
                            <option value="TOEFL iBT">TOEFL iBT</option>
                            <option value="Cambridge B2 First (FCE)">B2 First (FCE)</option>
                            <option value="Cambridge C1 Advanced (CAE)">C1 Advanced (CAE)</option>
                        </optgroup>
                        <optgroup label="Chủ đề IELTS">
                            <option value="IELTS Writing Task 2 - Education">IELTS Writing - Education</option>
                            <option value="IELTS Writing Task 2 - Environment">IELTS Writing - Environment</option>
                            <option value="IELTS Writing Task 2 - Technology">IELTS Writing - Technology</option>
                            <option value="IELTS Writing Task 2 - Health">IELTS Writing - Health</option>
                            <option value="IELTS Speaking Part 2 - Describe">IELTS Speaking - Describe</option>
                            <option value="IELTS Reading - Academic vocabulary">IELTS Reading</option>
                        </optgroup>
                        <optgroup label="Chủ đề TOEIC">
                            <option value="TOEIC - Office & Business">TOEIC - Văn phòng</option>
                            <option value="TOEIC - Finance & Banking">TOEIC - Tài chính</option>
                            <option value="TOEIC - Travel & Tourism">TOEIC - Du lịch</option>
                            <option value="TOEIC - Manufacturing & Technology">TOEIC - Sản xuất & CN</option>
                            <option value="TOEIC - Human Resources">TOEIC - Nhân sự</option>
                            <option value="TOEIC - Marketing & Sales">TOEIC - Marketing</option>
                        </optgroup>
                        <optgroup label="Trình độ">
                            <option value="Band 5.0-5.5 IELTS vocabulary">IELTS 5.0-5.5</option>
                            <option value="Band 6.0-6.5 IELTS vocabulary">IELTS 6.0-6.5</option>
                            <option value="Band 7.0+ IELTS vocabulary">IELTS 7.0+</option>
                            <option value="TOEIC 450-600 vocabulary">TOEIC 450-600</option>
                            <option value="TOEIC 600-800 vocabulary">TOEIC 600-800</option>
                            <option value="TOEIC 800+ vocabulary">TOEIC 800+</option>
                        </optgroup>
                    </select>
                    <input type="text" class="eng-custom-topic" id="engCustomTopic" placeholder="Hoặc nhập chủ đề riêng...">
                </div>
                <div class="eng-gen-bar2">
                    <div class="eng-count-wrap">
                        <label>Số từ:</label>
                        <input type="number" class="eng-count-input" id="engWordCount" value="5" min="1" max="100">
                    </div>
                    <button class="eng-btn" id="engGenBtn" onclick="engGenerateWords()">✨ Tạo từ vựng</button>
                </div>

                <!-- Generated words (current batch) -->
                <div class="eng-word-list" id="engWordList">
                    <div class="eng-empty">Chọn chủ đề và bấm "Tạo từ vựng" để bắt đầu!</div>
                </div>
            </div>

            <!-- Panel: Saved words -->
            <div id="engPanel_saved" style="display:none">
                <!-- Manual add word -->
                <div class="eng-add-word-bar">
                    <button class="eng-add-word-toggle" onclick="engToggleAddWord()">➕ Thêm từ thủ công</button>
                    <div class="eng-add-word-form hidden" id="engAddWordForm">
                        <div class="eng-add-row">
                            <input type="text" class="eng-add-input" id="engAddWord" placeholder="Từ tiếng Anh *">
                            <input type="text" class="eng-add-input" id="engAddMeaning" placeholder="Nghĩa tiếng Việt *">
                        </div>
                        <div class="eng-add-row">
                            <input type="text" class="eng-add-input" id="engAddPhonetic" placeholder="Phiên âm (tùy chọn)">
                            <select class="eng-add-input" id="engAddPos">
                                <option value="">Loại từ</option>
                                <option value="noun">Noun</option>
                                <option value="verb">Verb</option>
                                <option value="adjective">Adjective</option>
                                <option value="adverb">Adverb</option>
                                <option value="phrase">Phrase</option>
                            </select>
                        </div>
                        <div class="eng-add-row">
                            <input type="text" class="eng-add-input eng-add-full" id="engAddExample" placeholder="Câu ví dụ (tùy chọn)">
                        </div>
                        <button class="eng-btn" onclick="engAddWordManual()">💾 Lưu từ</button>
                    </div>
                </div>
                <div class="eng-saved-filters" id="engSavedFilters">
                    <select class="eng-filter-select" id="engFilterTopic" onchange="engApplyFilters()">
                        <option value="">📁 Tất cả chủ đề</option>
                    </select>
                    <select class="eng-filter-select" id="engFilterPos" onchange="engApplyFilters()">
                        <option value="">📝 Tất cả loại từ</option>
                        <option value="noun">Noun</option>
                        <option value="verb">Verb</option>
                        <option value="adjective">Adjective</option>
                        <option value="adverb">Adverb</option>
                        <option value="phrase">Phrase</option>
                    </select>
                    <select class="eng-filter-select" id="engFilterMastery" onchange="engApplyFilters()">
                        <option value="">⭐ Tất cả mức độ</option>
                        <option value="1">Mới</option>
                        <option value="2">Quen</option>
                        <option value="3">Khá</option>
                        <option value="4">Giỏi</option>
                        <option value="5">Thành thạo</option>
                    </select>
                </div>
                <div class="eng-saved-list" id="engSavedList"></div>
                <div class="eng-pagination" id="engPagination"></div>
            </div>

            <!-- Panel: Review -->
            <div id="engPanel_review" style="display:none">
                <div id="engReviewArea"></div>
            </div>

            <!-- Panel: Quiz -->
            <div id="engPanel_quiz" style="display:none">
                <div id="engQuizArea"></div>
            </div>

            <!-- Panel: Games -->
            <div id="engPanel_games" style="display:none">
                <div class="eng-games-menu" id="engGamesMenu">
                    <h3 class="eng-games-title">🎮 Chọn trò chơi</h3>
                    <div class="eng-games-grid">
                        <button class="eng-game-card" onclick="engGameStart('match')">
                            <span class="eng-game-icon">🔗</span>
                            <span class="eng-game-name">Word Match</span>
                            <span class="eng-game-desc">Nối từ với nghĩa đúng</span>
                        </button>
                        <button class="eng-game-card" onclick="engGameStart('spelling')">
                            <span class="eng-game-icon">✍️</span>
                            <span class="eng-game-name">Spelling Bee</span>
                            <span class="eng-game-desc">Đọc nghĩa, gõ từ tiếng Anh</span>
                        </button>
                        <button class="eng-game-card" onclick="engGameStart('scramble')">
                            <span class="eng-game-icon">🔀</span>
                            <span class="eng-game-name">Word Scramble</span>
                            <span class="eng-game-desc">Sắp xếp lại chữ cái</span>
                        </button>
                    </div>
                </div>
                <div id="engGameArea" style="display:none"></div>
            </div>
        </div>
    </section>
