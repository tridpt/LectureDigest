    <!-- ═══════════════════════════ CHAT ROOMS ═══════════════════════════ -->

    <!-- Room List View -->
    <section id="chatRoomsSection" class="section hidden" aria-label="Phòng chat">
        <div class="cr-container">
            <div class="cr-header">
                <button type="button" class="cr-back-btn" onclick="closeChatRooms()" aria-label="Quay lại">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <h2 class="cr-title">💬 Phòng chat</h2>
                <div class="cr-header-actions">
                    <button type="button" class="cr-btn cr-btn-outline" onclick="crOpenPublicBrowser()">🌐 Khám phá</button>
                    <button type="button" class="cr-btn cr-btn-primary" onclick="crOpenCreateModal()">+ Tạo phòng</button>
                </div>
            </div>

            <div class="cr-room-list" id="crRoomList">
                <div class="cr-empty" id="crEmptyState">
                    <div style="font-size:3rem">💬</div>
                    <p>Chưa có phòng chat nào</p>
                    <p style="opacity:0.6;font-size:0.85rem">Tạo phòng mới hoặc tham gia phòng công khai</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Chat Detail View -->
    <section id="chatDetailSection" class="section hidden" aria-label="Chi tiết phòng chat">
        <div class="cr-chat-container">
            <div class="cr-chat-header">
                <button type="button" class="cr-back-btn" onclick="crBackToList()" aria-label="Quay lại danh sách">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="cr-chat-room-info" onclick="crShowRoomInfo()" style="cursor:pointer">
                    <span class="cr-chat-room-icon" id="crChatRoomIcon">💬</span>
                    <span class="cr-chat-room-name" id="crChatRoomName">Room</span>
                    <span class="cr-chat-room-members" id="crChatRoomMembers">0 thành viên</span>
                </div>
                <div class="cr-chat-header-actions">
                    <button type="button" class="cr-btn cr-btn-outline" onclick="crToggleSearch()" title="Tìm kiếm" style="font-size:12px;padding:4px 10px">🔍</button>
                    <button type="button" class="cr-btn cr-btn-outline cr-reports-btn hidden" id="crReportsBtn" onclick="crViewReports()" title="Báo cáo" style="font-size:12px;padding:4px 10px;position:relative">
                        ⚠️ <span class="cr-reports-badge hidden" id="crReportsBadge">0</span>
                    </button>
                    <button type="button" class="cr-btn cr-btn-outline" onclick="crShowMembers()" title="Thành viên" style="font-size:12px;padding:4px 10px">👥</button>
                    <div class="cr-header-more-wrap">
                        <button type="button" class="cr-btn cr-btn-outline" onclick="crToggleHeaderMenu()" title="Thêm" style="font-size:12px;padding:4px 10px">⋯</button>
                        <div class="cr-header-menu hidden" id="crHeaderMenu">
                            <button class="cr-hm-item" onclick="crCloseHeaderMenu();crShowRoomInfo()">ℹ️ Thông tin phòng</button>
                            <button class="cr-hm-item" id="crHmOnline" onclick="crCloseHeaderMenu();crToggleOnlineVisibility()">👻 Ẩn/hiện online</button>
                            <button class="cr-hm-item" id="crHmNotif" onclick="crCloseHeaderMenu();crToggleNotifMute()">🔕 Tắt thông báo</button>
                            <button class="cr-hm-item" id="crHmLock" onclick="crCloseHeaderMenu();crLockChat()" style="display:none">🔒 Khóa chat</button>
                            <button class="cr-hm-item" id="crHmUnlock" onclick="crCloseHeaderMenu();crUnlockChat()" style="display:none">🔓 Mở khóa chat</button>
                            <button class="cr-hm-item" id="crHmClear" onclick="crCloseHeaderMenu();crClearAllMessages()" style="display:none">🧹 Xóa tất cả tin nhắn</button>
                            <button class="cr-hm-item cr-hm-danger" onclick="crCloseHeaderMenu();crLeaveRoom()">🚪 Rời phòng</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search panel -->
            <div class="cr-search-panel hidden" id="crSearchPanel">
                <div class="cr-search-input-wrap">
                    <input type="text" class="cr-search-input" id="crSearchInput" placeholder="Tìm tin nhắn..." oninput="crSearchMessages()" autocomplete="off">
                    <button class="cr-search-close" onclick="crToggleSearch()">✕</button>
                </div>
                <div class="cr-search-results" id="crSearchResults"></div>
            </div>

            <!-- Pinned messages trigger -->
            <div class="cr-pinned-trigger hidden" id="crPinnedTrigger" onclick="crOpenPinnedPanel()">
                <span>📌</span>
                <span id="crPinnedTriggerText">0 tin nhắn đã ghim</span>
                <span class="cr-pinned-arrow">▾</span>
            </div>

            <div class="cr-messages-area" id="crMessagesArea">
                <div class="cr-messages-list" id="crMessagesList"></div>
            </div>
            <button type="button" class="cr-scroll-bottom-btn hidden" id="crUnreadBtn" onclick="crJumpToUnread()">
                <span id="crUnreadBtnText">↓ Xuống cuối</span>
            </button>

            <div class="cr-typing-indicator hidden" id="crTypingIndicator"></div>
            <div class="cr-img-preview hidden" id="crImgPreview">
                <img id="crImgPreviewImg" src="" alt="Preview">
                <button type="button" class="cr-img-preview-close" onclick="crCancelImage()">✕</button>
            </div>
            <div class="cr-input-bar">
                <button type="button" class="cr-img-btn" onclick="document.getElementById('crImageInput').click()" title="Gửi ảnh" aria-label="Gửi ảnh">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                </button>
                <div class="cr-emoji-wrap">
                    <button type="button" class="cr-img-btn" onclick="crToggleEmojiPicker()" title="Emoji" aria-label="Emoji">😊</button>
                    <div class="cr-emoji-picker hidden" id="crEmojiPicker"></div>
                </div>
                <input type="file" id="crImageInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none" onchange="crPreviewImage(this)">
                <input type="text" class="cr-message-input" id="crMessageInput"
                       placeholder="Nhập tin nhắn..." maxlength="2000"
                       oninput="_crOnTyping();_crOnInputForMention()"
                       onblur="setTimeout(_crHideMentionDropdown,200)"
                       onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();crSendMessage();}">
                <button type="button" class="cr-send-btn" onclick="crSendMessage()" aria-label="Gửi">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </div>
    </section>

    <!-- Create Room Modal -->
    <div class="cr-modal-overlay hidden" id="crCreateModalOverlay" onclick="if(event.target===this)crCloseCreateModal()">
        <div class="cr-modal">
            <div class="cr-modal-header">
                <h3>Tạo phòng chat mới</h3>
                <button type="button" class="cr-modal-close" onclick="crCloseCreateModal()">&times;</button>
            </div>
            <div class="cr-modal-body">
                <label class="cr-label">Tên phòng</label>
                <input type="text" class="cr-input" id="crCreateName" placeholder="Nhập tên phòng..." maxlength="100">

                <label class="cr-label">Biểu tượng</label>
                <div class="cr-icon-picker" id="crIconPicker">
                    <button type="button" class="cr-icon-opt selected" data-icon="💬" onclick="crSelectIcon(this)">💬</button>
                    <button type="button" class="cr-icon-opt" data-icon="🎓" onclick="crSelectIcon(this)">🎓</button>
                    <button type="button" class="cr-icon-opt" data-icon="📚" onclick="crSelectIcon(this)">📚</button>
                    <button type="button" class="cr-icon-opt" data-icon="💡" onclick="crSelectIcon(this)">💡</button>
                    <button type="button" class="cr-icon-opt" data-icon="🚀" onclick="crSelectIcon(this)">🚀</button>
                    <button type="button" class="cr-icon-opt" data-icon="🎮" onclick="crSelectIcon(this)">🎮</button>
                    <button type="button" class="cr-icon-opt" data-icon="🎵" onclick="crSelectIcon(this)">🎵</button>
                    <button type="button" class="cr-icon-opt" data-icon="⚡" onclick="crSelectIcon(this)">⚡</button>
                    <button type="button" class="cr-icon-opt" data-icon="🌟" onclick="crSelectIcon(this)">🌟</button>
                    <button type="button" class="cr-icon-opt" data-icon="🔥" onclick="crSelectIcon(this)">🔥</button>
                    <button type="button" class="cr-icon-opt" data-icon="💻" onclick="crSelectIcon(this)">💻</button>
                    <button type="button" class="cr-icon-opt" data-icon="🎯" onclick="crSelectIcon(this)">🎯</button>
                </div>

                <label class="cr-label">Loại phòng</label>
                <div class="cr-toggle-row">
                    <span>Công khai</span>
                    <label class="cr-toggle">
                        <input type="checkbox" id="crCreatePublic" checked>
                        <span class="cr-toggle-slider"></span>
                    </label>
                </div>
                <p class="cr-hint">Phòng công khai cho phép mọi người tìm và tham gia</p>

                <label class="cr-label">Số thành viên tối đa</label>
                <input type="number" class="cr-input" id="crCreateMaxMembers" value="50" min="2" max="200">
            </div>
            <div class="cr-modal-footer">
                <button type="button" class="cr-btn cr-btn-outline" onclick="crCloseCreateModal()">Hủy</button>
                <button type="button" class="cr-btn cr-btn-primary" onclick="crCreateRoom()">Tạo phòng</button>
            </div>
        </div>
    </div>

    <!-- Public Rooms Browser Modal -->
    <div class="cr-modal-overlay hidden" id="crPublicModalOverlay" onclick="if(event.target===this)crClosePublicBrowser()">
        <div class="cr-modal cr-modal-lg">
            <div class="cr-modal-header">
                <h3>🌐 Phòng chat công khai</h3>
                <button type="button" class="cr-modal-close" onclick="crClosePublicBrowser()">&times;</button>
            </div>
            <div class="cr-modal-body">
                <div class="cr-public-list" id="crPublicList">
                    <div class="cr-empty">
                        <p>Đang tải...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
