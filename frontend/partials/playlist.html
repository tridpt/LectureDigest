    <!-- ═══════════════════════════ PLAYLIST / COURSE VIEW ═══════════════════════════ -->
    <section class="playlist-section hidden" id="playlistSection" aria-label="Playlist">
        <div class="pl-content">
            <div class="pl-header">
                <button type="button" class="pl-back-btn" onclick="closePlaylist()" aria-label="Quay lại">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
                        <path d="M19 12H5M12 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Quay lại
                </button>
                <div class="pl-header-info">
                    <div class="pl-tag">📚 Playlist Mode</div>
                    <h1 class="pl-title" id="plTitle">Playlist Title</h1>
                    <p class="pl-author" id="plAuthor"></p>
                    <div class="pl-stats">
                        <span class="pl-stat" id="plVideoCount">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            0 videos
                        </span>
                        <span class="pl-stat" id="plAnalyzedCount">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            0 đã phân tích
                        </span>
                    </div>
                </div>
            </div>

            <!-- Course progress -->
            <div class="pl-progress-wrap">
                <div class="pl-progress-info">
                    <span class="pl-progress-label">Tiến độ khóa học</span>
                    <span class="pl-progress-pct" id="plProgressPct">0%</span>
                </div>
                <div class="pl-progress-bar">
                    <div class="pl-progress-fill" id="plProgressFill"></div>
                </div>
            </div>

            <!-- Video grid -->
            <div class="pl-video-list" id="plVideoList">
                <!-- Filled by JS -->
            </div>
        </div>
    </section>
