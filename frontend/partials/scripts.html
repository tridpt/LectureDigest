    <!-- ── Lazy-loaded: injected on demand when user opens the feature ── -->
    <script>
    /**
     * Lazy script loader — loads JS files only when the feature is first accessed.
     * Reduces initial page load by ~60% (from 44 scripts to 21 upfront).
     */
    const _lazyScripts = {};
    const _lazyLoaded = new Set();

    function lazyLoad(src) {
        if (_lazyLoaded.has(src)) return Promise.resolve();
        // Skip if D3 is already loaded globally
        if (src.includes('d3.min.js') && window.d3) { _lazyLoaded.add(src); return Promise.resolve(); }
        if (_lazyScripts[src]) return _lazyScripts[src];

        _lazyScripts[src] = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = () => { _lazyLoaded.add(src); resolve(); };
            s.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.body.appendChild(s);
        });
        return _lazyScripts[src];
    }

    function lazyLoadMultiple(srcs) {
        // Load sequentially to respect dependency order (e.g., D3 before mindmap)
        return srcs.reduce((chain, src) => chain.then(() => lazyLoad(src)), Promise.resolve());
    }

    // Feature groups for lazy loading
    const LAZY_MODULES = {
        mindmap:        ['https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js', '/js/mindmap.js'],
        knowledgeGraph: ['https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js', '/js/knowledge-graph.js'],
        exam:           ['/js/exam.js'],
        exercises:      ['/js/exercises.js'],
        studyPlan:      ['/js/study-plan.js'],
        studyRooms:     ['/js/study-rooms.js'],
        chatRooms:      ['/js/chat-rooms.js'],
        english:        ['/js/english.js'],
        compare:        ['/js/compare.js'],
        pdfExport:      ['/js/pdf-export.js'],
        playlist:       ['/js/playlist.js'],
        analytics:      ['/js/analytics.js?v=2'],
        dashboard:      ['/dashboard.js?v=2'],
        conceptExplainer: ['/concept-explainer.js'],
        shareNotes:     ['/js/share-notes.js'],
        autoNotes:      ['/js/auto-notes.js'],
        weeklyGoals:    ['/js/weekly-goals.js'],
        leaderboard:    ['/js/leaderboard.js'],
        tts:            ['/js/tts.js'],
        badgesPage:     ['/js/badges-page.js'],
        srsReview:      ['/js/srs-review.js'],
        search:         ['/js/search.js'],
    };

    /**
     * Load a feature module by name. Returns a promise.
     * Usage: await loadFeature('mindmap');
     */
    function loadFeature(name) {
        const srcs = LAZY_MODULES[name];
        if (!srcs) { console.warn('Unknown lazy module:', name); return Promise.resolve(); }
        return lazyLoadMultiple(srcs);
    }

    // ── Auto-load features when their triggers are activated ──
    // These are loaded when the user navigates to a section that needs them

    // Preload commonly needed features after page is idle
    if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
            // Preload dashboard since it's accessed from header
            lazyLoad('/dashboard.js?v=2');
            lazyLoad('/js/badges-page.js');
            lazyLoad('/js/srs-review.js');
        }, { timeout: 5000 });
    } else {
        setTimeout(() => {
            lazyLoad('/dashboard.js?v=2');
            lazyLoad('/js/badges-page.js');
            lazyLoad('/js/srs-review.js');
        }, 3000);
    }
    </script>
