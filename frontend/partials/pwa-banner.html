    <!-- ══════════════════════════════ PWA INSTALL BANNER ══════════════════════════════ -->
    <div class="pwa-install-banner hidden" id="pwaInstallBanner">
        <button type="button" class="pwa-banner-close" id="pwaCloseBtn" aria-label="Đóng">✕</button>
        <div class="pwa-banner-body">
            <div class="pwa-banner-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
                </svg>
            </div>
            <div class="pwa-banner-content">
                <div class="pwa-banner-title">Cài LectureDigest</div>
                <div class="pwa-banner-desc">Truy cập nhanh hơn, hoạt động offline, trải nghiệm như app native</div>
            </div>
        </div>
        <div class="pwa-banner-actions">
            <button type="button" class="pwa-install-btn" id="pwaInstallBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Cài đặt
            </button>
            <button type="button" class="pwa-later-btn" id="pwaLaterBtn">Để sau</button>
        </div>
    </div>
    <script>
    // Bind PWA banner buttons via JS (onclick attributes can fail in some contexts)
    document.addEventListener('DOMContentLoaded', function() {
        var installBtn = document.getElementById('pwaInstallBtn');
        var laterBtn = document.getElementById('pwaLaterBtn');
        var closeBtn = document.getElementById('pwaCloseBtn');
        if (installBtn) installBtn.addEventListener('click', function(e) { e.stopPropagation(); installPwa(); });
        if (laterBtn)   laterBtn.addEventListener('click', function(e) { e.stopPropagation(); dismissPwaInstall(); });
        if (closeBtn)   closeBtn.addEventListener('click', function(e) { e.stopPropagation(); dismissPwaInstall(); });
    });
    </script>

    <!-- PWA Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js')
                .then(function(reg) { console.log('[PWA] SW registered:', reg.scope); })
                .catch(function(err) { console.warn('[PWA] SW failed:', err); });
        });
    }
    </script>
